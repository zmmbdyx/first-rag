name: 脱敏审计

# 每次 push / PR 自动扫描密钥、私有端点与个人敏感信息。
# 仓库曾把私有推理端点写进早期提交，因此这里默认扫描**全部历史**。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: 扫描密钥与私有信息
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全部历史，否则审计只能看到最后一次提交
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行脱敏审计（全历史）
        run: python scripts/audit_secrets.py --repo .
