# 前端生产 nginx 配置
#
# 两个关键点：
#   1) 静态资源与 index.html 分开处理，index.html 不缓存，避免发版后拿到旧壳；
#   2) /api 反代到后端时，必须关闭 proxy_buffering 并调大读超时 ——
#      否则 SSE 流式输出会被 nginx 攒成一坨再一次性吐出，打字机效果消失。

upstream rag_backend {
    # compose 内的服务名；单机部署时改成 127.0.0.1:8000
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是单页应用：压缩交给构建产物（vite 已产出 gzip 友好的文件），
    # 这里只补 gzip 动态压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------- 静态资源：带哈希指纹，长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- API：反代到后端 ----------
    location /api/ {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ---- SSE 关键配置 ----
        proxy_buffering off;          # 不缓冲响应，逐块转发
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;      # 长回答/慢模型，别中途掐断
        proxy_send_timeout 600s;

        # 上传大文档
        client_max_body_size 64m;
    }

    # ---------- SPA 回退：其余路径都交给 index.html ----------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
